name: motive-fashion

services:
  postgres:
    image: postgres:16-alpine
    container_name: motive-fashion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: motive
      POSTGRES_PASSWORD: motive
      POSTGRES_DB: motive_fashion
    ports:
      - "5435:5432"
    volumes:
      - motive_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motive -d motive_fashion"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: motive-fashion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - motive_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["stack"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: motive-fashion-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://motive:motive@postgres:5432/motive_fashion?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-compose}
      ALLOW_MOCK_PAYMENTS: "false"
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "4000:4000"
    volumes:
      - motive_uploads:/app/apps/api/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["stack"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: motive-fashion-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://motive:motive@postgres:5432/motive_fashion?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-compose}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    command: ["node", "dist/worker.js"]
    volumes:
      - motive_uploads:/app/apps/api/uploads

volumes:
  motive_pg:
    name: motive-fashion-pg
  motive_redis:
    name: motive-fashion-redis
  motive_uploads:
    name: motive-fashion-uploads
