name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @motive-fashion/api exec prisma validate
        working-directory: .
      - run: pnpm --filter "./packages/*" typecheck
      - run: pnpm --filter @motive-fashion/api typecheck
      - run: pnpm --filter @motive-fashion/api test
      - run: pnpm --filter @motive-fashion/web typecheck
      - run: pnpm --filter @motive-fashion/mobile typecheck
      - run: pnpm --filter @motive-fashion/web build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
