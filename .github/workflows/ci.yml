name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: motive
          POSTGRES_PASSWORD: motive
          POSTGRES_DB: motive_fashion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motive -d motive_fashion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://motive:motive@localhost:5432/motive_fashion?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-not-a-placeholder-value
      STRIPE_WEBHOOK_SECRET: whsec_ci_smoke
      ALLOW_MOCK_PAYMENTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @motive-fashion/api exec prisma validate
        working-directory: .
      - run: pnpm --filter "./packages/*" typecheck
      - run: pnpm --filter @motive-fashion/api typecheck
      - run: pnpm --filter @motive-fashion/api exec prisma migrate deploy
      - run: pnpm --filter @motive-fashion/api prisma:seed
      - run: pnpm --filter @motive-fashion/api test
      - run: pnpm --filter @motive-fashion/web typecheck
      - run: pnpm --filter @motive-fashion/mobile typecheck
      - run: pnpm --filter @motive-fashion/web build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
